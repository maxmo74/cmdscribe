# /etc/rsyslog.d/10-cmdscribe.conf
#
# Rendered by install.sh. See "who may own the log" in install.sh for why the
# owner and group below are substituted rather than fixed.
#
# Low number on purpose: the `stop` must run BEFORE Debian's default
# `*.*  /var/log/syslog` rule or every record is written twice.
#
# Do NOT add a second `module(load="imuxsock")` here -- Debian's
# /etc/rsyslog.conf already loads it and a duplicate load stops rsyslog
# from starting. Edit that existing line to add AnnotatePIDs="on", which
# records the real sending pid so forged records are detectable.

template(name="CmdscribeFormat" type="string"
  string="%timegenerated:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
)

# The owner must be the account rsyslog runs as -- root on Debian, syslog on
# Ubuntu -- or rsyslog cannot reopen the file after logrotate creates it. The
# group must be the one that owns /var/log, or logrotate refuses to rotate the
# log at all. Mode stays 0600, so the group bits grant nothing to anyone: the
# readers are the file owner and root, exactly as SECURITY.md states.

# Match on "contains", not equality. RHEL 9 feeds rsyslog through journald, which
# annotates the tag with the sending pid: `logger -t cmdscribe` arrives as
# `cmdscribe[16357]:`, not `cmdscribe:`. Equality matched Debian and Ubuntu and
# matched NOTHING on RHEL-family, so every record fell through to the distro's
# default rule and landed in /var/log/messages -- which /etc/logrotate.d/rsyslog
# rotates weekly under the global `rotate 4`, deleting the command history after
# about a month while install.sh reported success. The only tag containing
# "cmdscribe" that is not ours would have to be called cmdscribe.
if $syslogtag contains 'cmdscribe' then {
    action(type="omfile"
           file="/var/log/cmdscribe.log"
           template="CmdscribeFormat"
           fileOwner="@CS_LOG_USER@"
           fileGroup="@CS_LOG_GROUP@"
           fileCreateMode="0600"
           dirCreateMode="0700")
    stop
}

